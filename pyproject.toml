[project]
name = "ai-berkshire"
version = "0.1.0"
description = "AI 时代的价值投资研究框架 — Claude Code / Codex 投研 Skill 合集"
requires-python = ">=3.9"
dependencies = [
    "tushare", # 官方 tushare（默认源），ttshare 代理不可用时的兜底
    "ttshare", # tushare 第三方代理（显式指定 tsdoc 源），优先使用
    "tickflow>=0.1.24",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# ttshare 仅存在于第三方源 tsdoc.pages.dev，显式指定；
# explicit = true 使该源只在包被显式指向时参与解析，不影响其他包（tushare 等走默认源）
[[tool.uv.index]]
name = "ttshare-proxy"
url = "https://tsdoc.pages.dev/simple/"
explicit = true

[tool.uv.sources]
ttshare = { index = "ttshare-proxy" }
